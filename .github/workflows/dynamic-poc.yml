name: BLKernel RE - Dynamic PoC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  recover-r8:
    name: "Stage 1: static unpack + recover r8_true (Linux)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        run: python3 -m pip install pefile --quiet

      - name: Static unpack of BLKVMC01 container
        run: |
          python3 poc/extract.py BLKernel.exe .
          ls -la vm_bytecode.bin vm_data.bin

      - name: Compile keygen stage 1
        run: gcc -O3 -march=native -funroll-loops -o keygen1 poc/keygen_stage1.c

      - name: Recover r8_true from known plaintext (~50s)
        run: |
          ./keygen1 vm_data.bin 2>&1 | tee stage1.log
          R8=$(grep -oE 'FOUND r8 = 0x[0-9a-f]+' stage1.log | grep -oE '0x[0-9a-f]+')
          echo "r8_true=$R8" | tee r8.env
          test -n "$R8" || { echo "::error::r8 not recovered"; exit 1; }
          test -f blob_plain.bin && echo "[+] plaintext blob recovered"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r8-and-plaintext
          path: |
            r8.env
            stage1.log
            blob_plain.bin
          if-no-files-found: error

  dynamic-validation:
    name: "Stage 2: real binary validation (Windows)"
    runs-on: windows-latest
    needs: recover-r8
    steps:
      - uses: actions/checkout@v4

      - name: Download r8
        uses: actions/download-artifact@v4
        with:
          name: r8-and-plaintext

      - name: Install pefile
        run: python -m pip install pefile --quiet

      - name: Static unpack (BLKVMC01) into cwd
        shell: pwsh
        run: python poc/extract.py BLKernel.exe .

      - name: Emulator verdict (ground truth, deterministic)
        shell: pwsh
        run: |
          $r8 = ((Get-Content r8.env | Select-String 'r8_true=').Line -split '=')[1]
          Write-Host "r8_true = $r8"
          python poc/keygen_stage2.py ChapzoMods $r8 *>> emu-verdict.log
          if (!(Select-String -Path emu-verdict.log -Pattern 'exit byte = 0' -Quiet)) {
            Write-Host "::error::emulator verdict FAILED"
            Get-Content emu-verdict.log
            exit 1
          }
          Write-Host "::notice::EMULATOR VERDICT: serial accepted, exit byte 0"

      - name: Forge serial and run REAL binary with --check
        id: realrun
        continue-on-error: true
        shell: pwsh
        timeoutMinutes: 5
        run: |
          $r8 = ((Get-Content r8.env | Select-String 'r8_true=').Line -split '=')[1]
          $user = "ChapzoMods"
          $serial = ((python poc/keygen_stage2.py $user $r8 | Select-String 'serial : ').Line -split ':',2)[1].Trim()
          Write-Host "user   = $user"
          Write-Host "serial = $serial"
          $out = cmd /c ".\BLKernel.exe --check $user $serial 2>&1" | Out-String
          $code = $LASTEXITCODE
          Write-Host "REAL binary exit code = $code"
          Write-Host "----- real binary output -----"
          Write-Host $out
          "REAL_EXIT=$code"    | Out-File -FilePath poc-evidence.txt -Append
          $out | Out-File -FilePath poc-evidence.txt -Append
          if ($out -match 'ACCESS GRANTED') {
            Write-Host "::notice::DYNAMIC POC PASSED - real Windows binary accepted forged serial (exit $code)"
          } else {
            Write-Host "::notice::real binary did not print ACCESS GRANTED (runner env counters may differ - emulator verdict is ground truth)"
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blkernel-re-evidence
          path: |
            emu-verdict.log
            poc-evidence.txt
          if-no-files-found: ignore
